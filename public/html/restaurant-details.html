<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Details - Food Advisor</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/response.css">
</head>

<body>

    <header>
        <h1>Food Advisor</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="restaurants-page.html">Restaurants</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <a href="restaurants-page.html" class="back-button">
            ← Back to Restaurants
        </a>

        <div class="restaurant-top">
            <section id="restaurant-info">
                <p>Loading restaurant details...</p>
            </section>

            <section id="review-section">
                <h2>Leave a Review</h2>

                <div id="stars">
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                </div>

                <p>
                    Rating:
                    <span id="ratingValue">0</span>/5
                </p>

                <textarea
                    id="reviewText"
                    rows="5"
                    cols="50"
                    placeholder="Write your review here..."></textarea>

                <br><br>

                <button id="submitReview">
                    Submit Review
                </button>
            </section>
        </div>

        <section class="menu-section">
            <h2>Our Menu</h2>
            <p>Loading menu...</p>
        </section>

        <section id="reviews-section">
            <h2>Customer Reviews</h2>

            <div id="reviews-container">
                <p>Loading reviews...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Food Advisor. All rights reserved.</p>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/rating.js"></script>
</body>
</html>
