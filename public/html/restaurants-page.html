<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Advisor</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/response.css">
</head>
<body>
    <header>
    <h1>Food Advisor</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="restaurants-page.html">Restaurants</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h2>Find your next favourite meal</h2>
        <p>Explore and discover new culinary experiences.</p>

        <a href="restaurants-page.html" class="explore-button">
            Explore Restaurants
        </a>

        <div class="topnav">
  
  <input id="restaurantSearch" type="text" class="restaurant-search"
       placeholder="Search restaurants...">
        </div>
    </section>

    <h2 style = "display: flex; justify-content: center;">Available Restaurants</h2>
<div class="filter-container">
<select id="cuisineFilter" class="cuisine-filter">
    <option value="">All cuisines</option>
    <option value="italian">Italian</option>
    <option value="chinese">Chinese</option>
    <option value="indian">Indian</option>
</select>

<select  id= "priceFilter" class="price-filter">
    <option value="">All prices</option>
    <option value="budget">Budget</option>
    <option value="moderate">Moderate</option>
    <option value="expensive">Expensive</option>
</select>

<select  id = "dietaryFilter" class ="dietary-filter">
    <option value="">Dietary Preferences</option>
    <option value="vegetarian">Vegetarian</option>
    <option value="vegan">Vegan</option>
    <option value="gluten-free">Gluten-Free</option>
    <option value="halal">Halal</option>
</select>

<select id="locationFilter" class="location-filter">
        <option value="">All locations</option>
        <option value="edinburgh">Edinburgh</option>
        <option value="glasgow">Glasgow</option>
        <option value="stirling">Stirling</option>
    </select>
</div>

<section id="restaurant-List" class="restaurant-list">
    <div class="restaurant-container">
        <p>Loading restaurants...</p>
    </div>
</section>
</main>

<footer>
    <p>&copy; 2026 Food Advisor. All rights reserved.</p>
</footer>
    
<script src="../js/auth.js"></script>
<script src="../js/search.js"></script>
</body>
</html>
